<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Football Survivor · Rivoluzione</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=Anton&family=Bebas+Neue&family=Big+Shoulders+Display:wght@600;800;900&family=DM+Serif+Display&family=Space+Mono:wght@400;700&family=Archivo+Black&family=Inter:wght@400;600;800&family=Caveat+Brush&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#0a0a0b;color:#eee;font-family:Barlow,sans-serif;font-size:14px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1240px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 14px 80px;display:grid;gap:16px}
@media(min-width:900px){.wrap{grid-template-columns:410px 1fr}.stage{position:sticky;top:12px;align-self:start}}
h1{font:600 24px "Barlow Semi Condensed";text-align:center}h1 i{font-style:normal;color:#ff9f1c}
.lead{color:#9aa0aa;font-size:13px;margin:4px 0 10px;text-align:center;line-height:1.45}
.stage{position:sticky;top:0;z-index:5;background:#0a0a0b;padding:6px 0 10px}
@media(max-width:899px){.stage .phone{height:min(60vh,700px)}.stage .lead{display:none}}
.tabs{display:flex;gap:4px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
.tabs button{padding:6px 11px;border-radius:999px;background:#1a1c21;font:500 12.5px Barlow}.tabs button.on{background:#ff9f1c;color:#000}
.code{margin:8px 0 0;font:500 12px Barlow;color:#9aa0aa;text-align:center;line-height:1.5;word-break:break-word}.code b{color:#fff;letter-spacing:.3px}
.cp{display:inline-block;margin:6px 3px 0;padding:6px 14px;border-radius:999px;background:#1a1c21;font:500 12px Barlow}
.grp{background:#131417;border-radius:16px;padding:12px;margin-bottom:10px}
.grp h3{font:600 15px Barlow;margin-bottom:2px}.grp h3 small{font-weight:500;color:#ff9f1c;margin-left:6px;font-size:11px;letter-spacing:1px}.grp>p{font-size:12px;color:#8a909a;margin-bottom:8px;line-height:1.4}
.ops{display:grid;gap:5px}@media(min-width:600px){.ops{grid-template-columns:1fr 1fr}}
.o{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:12px;background:#1b1d22;font-size:13px;line-height:1.35;position:relative}
.o b{color:#ff9f1c;margin-right:6px;font-family:"Barlow Semi Condensed";font-size:15px}.o.on{background:#ff9f1c;color:#000}.o.on b{color:#000}
.o em{font-style:normal;display:block;color:#8a909a;font-size:11.5px;margin-top:2px}.o.on em{color:#3a2400}
.o .pl{position:absolute;right:8px;top:8px;padding:3px 9px;border-radius:999px;background:#2a2d34;color:#fff;font-size:11px}.o.on .pl{background:#000}
.hd2{font:700 18px "Barlow Semi Condensed";letter-spacing:.5px;margin:22px 2px 8px;color:#fff}.hd2 small{display:block;font:500 12px Barlow;color:#8a909a;letter-spacing:0;margin-top:2px}
.worlds{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}@media(min-width:600px){.worlds{grid-template-columns:repeat(4,1fr)}}
.wd{border-radius:14px;padding:10px;text-align:left;min-height:104px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;border:2px solid transparent}
.wd.on{border-color:#ff9f1c;box-shadow:0 0 0 3px rgba(255,159,28,.25)}
.wd b{font-size:15px;line-height:1.05;position:relative}.wd span{font-size:11px;opacity:.8;position:relative;margin-top:3px;line-height:1.25}.wd i{position:absolute;top:8px;left:10px;font:700 12px "Barlow Semi Condensed";font-style:normal;opacity:.85}

/* ═════ TELEFONO ═════ */
.phone{width:min(100%,380px);height:740px;margin:0 auto;border-radius:44px;border:9px solid #1d1f24;position:relative;overflow:hidden;background:var(--bg);color:var(--t);font-family:var(--bf);
  --bg:#000;--card:#121316;--card2:#1c1e23;--bd:transparent;--t:#f2f3f5;--t2:#9097a3;--acc:#ff9f1c;--acct:#000;--grn:#3ddc84;--red:#ff4d5a;--r:16px;--hf:"Barlow Semi Condensed";--bf:Barlow;--up:uppercase;--ls:.5px;--crsh:drop-shadow(0 0 1px rgba(255,255,255,.7));--navbg:rgba(18,20,24,.9)}
.scr{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding-bottom:30px;background:var(--bgimg,none) ,var(--bg)}
.phone.nb .scr{padding-bottom:110px}
.scr::-webkit-scrollbar{display:none}
.sbar{height:50px;display:flex;align-items:flex-start;justify-content:space-between;padding:15px 26px 0;font:600 14px Inter,sans-serif;position:relative}
.sbar::after{content:"";position:absolute;left:50%;top:10px;transform:translateX(-50%);width:104px;height:30px;border-radius:20px;background:#000}
.sbar i{font-style:normal;letter-spacing:1px;font-size:11px}
.pad{padding:0 12px}
.hf{font-family:var(--hf);text-transform:var(--up);letter-spacing:var(--ls)}
.cd{background:var(--card);border-radius:var(--r);border:var(--bdw,1px) solid var(--bd);position:relative}
.sec{font:600 11px var(--bf);letter-spacing:1.4px;text-transform:uppercase;color:var(--t2);margin:18px 2px 8px;display:flex;align-items:center;gap:8px;justify-content:center}
.sec::before,.sec::after{content:"";flex:1;height:1px;background:color-mix(in srgb,var(--t) 12%,transparent)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:calc(var(--r) - 2px);background:var(--acc);color:var(--acct);font:600 14px var(--hf);text-transform:var(--up);letter-spacing:var(--ls)}
.btn.g{background:var(--card2);color:var(--t)}
.mut{color:var(--t2)}.tiny{font-size:11px}.small{font-size:12.5px}
.ok{color:var(--grn)}.ko{color:var(--red)}
.row{display:flex;align-items:center;gap:8px}.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* stemmi */
.cr{width:var(--s,32px);height:var(--s,32px);flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;position:relative}
.cr img{width:100%;height:100%;object-fit:contain;filter:var(--crsh)}
.s2 .cr{border-radius:50%;background:linear-gradient(135deg,var(--c1) 50%,var(--c2) 50%);padding:calc(var(--s)*.16);box-shadow:0 0 0 2px color-mix(in srgb,var(--t) 20%,transparent)}
.s2 .cr img{filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.s3 .cr img{filter:drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff) drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.s4 .cr img{filter:brightness(0) invert(var(--inv,1)) opacity(.92)}
.s5 .cr img{filter:drop-shadow(0 1px 0 rgba(255,255,255,.5)) drop-shadow(0 6px 6px rgba(0,0,0,.65))}
.s5 .cr{transform:perspective(200px) rotateX(10deg)}
.used .cr img,.cr.used img{filter:grayscale(1) brightness(.45)!important}
.av{width:var(--s,32px);height:var(--s,32px);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:700 calc(var(--s,32px)*.38) var(--hf);color:#fff;flex:0 0 auto}
/* testata */
.hdr{text-align:center;padding:8px 12px 10px;line-height:1}
.hdr .l1{font:500 11px var(--hf);letter-spacing:6px;color:var(--t);opacity:.85}
.hdr .l2{font:700 34px var(--hf);color:var(--acc);letter-spacing:2px;margin:3px 0 4px;text-transform:uppercase}
.hdr .l3{font:500 10px var(--bf);letter-spacing:3px;color:var(--t)}
.hcnt{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:4px 10px;border-radius:999px;background:var(--card2);font:600 11px var(--bf);letter-spacing:.5px}
.hcnt i{width:7px;height:7px;border-radius:50%;background:var(--grn);box-shadow:0 0 8px var(--grn);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.3}}
.tick{overflow:hidden;white-space:nowrap;background:var(--card2);font:600 11px var(--bf);letter-spacing:.4px;padding:6px 0;border-block:1px solid color-mix(in srgb,var(--t) 10%,transparent)}
.tick span{display:inline-block;padding-left:100%;animation:tick 16s linear infinite}.tick b{color:var(--acc)}.tick em{font-style:normal;color:var(--red);margin:0 4px}
@keyframes tick{to{transform:translateX(-100%)}}
.hmini{display:flex;align-items:center;gap:8px;padding:6px 14px 10px}
.hmini b{font:700 22px var(--hf);color:var(--acc);text-transform:uppercase;letter-spacing:1px}.hmini .ic{margin-left:auto;display:flex;gap:4px}
.hmini .ic button{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--t2)}.hmini .ic button.on{background:var(--acc);color:var(--acct)}
.hmini svg,.nv svg{width:20px;height:20px}
/* menu */
.n1{display:flex;border-bottom:1px solid color-mix(in srgb,var(--t) 10%,transparent);margin:0 8px}
.n1 button{flex:1;padding:10px 0 9px;font:600 11.5px var(--bf);letter-spacing:.8px;text-transform:uppercase;color:var(--t2)}.n1 button.on{color:var(--t);box-shadow:inset 0 -2px 0 var(--acc)}
.nv{position:absolute;left:12px;right:12px;bottom:18px;z-index:20}
.n2{display:flex;gap:3px;padding:5px;border-radius:26px;background:var(--navbg);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border:1px solid color-mix(in srgb,var(--t) 14%,transparent);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.n2 button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 0;border-radius:20px;color:var(--t2);font:600 12px var(--bf);transition:flex .25s}
.n2 button span{display:none}.n2 button.on{flex:0 0 auto;padding:12px 15px;background:var(--acc);color:var(--acct)}.n2 button.on span{display:inline}
.n3{display:flex;align-items:flex-end;padding:8px 6px 6px;border-radius:24px;background:var(--navbg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid color-mix(in srgb,var(--t) 12%,transparent)}
.n3 button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 9.5px var(--bf);letter-spacing:.4px;color:var(--t2);text-transform:uppercase}.n3 button.on{color:var(--acc)}
.n3 .big{flex:0 0 auto;width:66px;height:66px;margin:-30px 6px 0;border-radius:50%;background:var(--acc);color:var(--acct);justify-content:center;box-shadow:0 0 0 5px var(--bg),0 0 26px color-mix(in srgb,var(--acc) 60%,transparent)}
.n3 .big svg{width:30px;height:30px}.n3 .big.on{color:var(--acct)}
.n4{padding:2px 14px 8px}
.n4 .wds{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;font:600 12px var(--bf);letter-spacing:.6px;text-transform:uppercase;color:var(--t2)}.n4 .wds::-webkit-scrollbar{display:none}
.n4 .wds button.on{color:var(--acc)}
.n4 h2{font:800 38px var(--hf);text-transform:var(--up);letter-spacing:var(--ls);line-height:1;margin-top:4px}
/* home: eroi */
.tkt{display:flex;background:var(--card);border-radius:var(--r);overflow:hidden;position:relative;border:var(--bdw,1px) solid var(--bd)}
.tkt .l{flex:1;padding:12px}.tkt .r{width:96px;border-left:2px dashed color-mix(in srgb,var(--t) 20%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center}
.tkt .k{font:600 10px var(--bf);letter-spacing:1.3px;color:var(--acc)}
.tkt .r b{font:700 20px var(--hf);color:var(--acc)}
.cdn{display:flex;justify-content:center;gap:6px;margin:10px 0}
.cdn div{width:62px;padding:10px 0 6px;border-radius:12px;background:var(--card2);text-align:center;position:relative;overflow:hidden}
.cdn div::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:color-mix(in srgb,var(--bg) 70%,transparent)}
.cdn b{display:block;font:700 34px var(--hf);line-height:1;font-variant-numeric:tabular-nums}.cdn small{font:600 9px var(--bf);letter-spacing:1px;color:var(--t2)}
.pst{border-radius:var(--r);overflow:hidden;position:relative;padding:16px;color:#fff;min-height:200px;display:flex;flex-direction:column;justify-content:flex-end}
.pst .wm{position:absolute;right:-40px;top:-20px;opacity:.28;--s:220px}
.pst .wm img{filter:none}
.pst small{font:600 10px Barlow;letter-spacing:2px;opacity:.85}
.pst h2{font:800 46px var(--hf);text-transform:uppercase;line-height:.9;letter-spacing:1px;position:relative}
.pst p{font:500 13px Barlow;opacity:.92;margin-top:6px;position:relative}
.pst .chg{position:absolute;top:12px;right:12px;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.35);font:600 11px Barlow;backdrop-filter:blur(8px)}
.ring{display:flex;align-items:center;gap:14px;padding:14px}
.ring svg{width:130px;height:130px;flex:0 0 auto}
.ff{position:relative;height:170px;border-radius:var(--r);overflow:hidden;display:flex}
.ff .h{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;font:700 15px var(--hf);text-transform:uppercase;letter-spacing:.5px}
.ff .h:first-child{clip-path:polygon(0 0,100% 0,82% 100%,0 100%);margin-right:-12%}.ff .h:last-child{clip-path:polygon(18% 0,100% 0,100% 100%,0 100%);margin-left:-12%}
.ff .vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 16px var(--hf);color:var(--acc);z-index:2;box-shadow:0 0 0 3px var(--acc)}
.ff .vs small{font:600 9px Barlow;color:var(--t)}
.ff .tag{position:absolute;top:8px;left:8px;padding:3px 8px;border-radius:6px;background:var(--acc);color:var(--acct);font:700 10px Barlow;letter-spacing:1px;z-index:3}
.bp{background:var(--card);border-radius:var(--r);overflow:hidden;border:var(--bdw,1px) solid var(--bd)}
.bp .top{background:var(--acc);color:var(--acct);padding:8px 12px;font:700 11px var(--bf);letter-spacing:2px;display:flex;justify-content:space-between}
.bp .mid{display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
.bp .mid b{font:800 36px var(--hf);line-height:1}.bp .mid small{display:block;font:500 10px var(--bf);color:var(--t2);letter-spacing:1px}
.bp .pl{flex:1;height:2px;margin:0 10px;background:repeating-linear-gradient(90deg,var(--t2) 0 5px,transparent 5px 9px);position:relative}.bp .pl::after{content:"⚽";position:absolute;left:50%;top:-10px;transform:translateX(-50%);font-size:15px}
.bp .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px 12px}.bp .grid small{display:block;font:600 9px var(--bf);letter-spacing:1px;color:var(--t2)}.bp .grid b{font:600 13px var(--bf)}
.bp .bar{height:34px;margin:0 14px 14px;background:repeating-linear-gradient(90deg,var(--t) 0 2px,transparent 2px 4px,var(--t) 4px 5px,transparent 5px 8px,var(--t) 8px 11px,transparent 11px 12px);opacity:.8}
.path{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:10px 6px;background:var(--card);border-radius:var(--r)}.path::-webkit-scrollbar{display:none}
.path div{min-width:44px;text-align:center;font:600 11px var(--hf);color:var(--grn)}
.warn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r);background:color-mix(in srgb,var(--red) 18%,var(--card));border:1px solid color-mix(in srgb,var(--red) 50%,transparent);font:500 12.5px var(--bf);margin-bottom:10px}
.warn b{color:var(--red)}
.reac{display:flex;gap:6px;flex-wrap:wrap}.reac span{padding:5px 10px;border-radius:999px;background:var(--card2);font:600 12px var(--bf)}
.cmt{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid color-mix(in srgb,var(--t) 8%,transparent);font-size:12.5px}
/* scegli */
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tc{background:var(--card);border-radius:calc(var(--r) - 4px);padding:9px 3px 7px;text-align:center;position:relative;border:var(--bdw,1px) solid var(--bd)}
.tc .nm{font:600 11.5px var(--bf);margin-top:4px}.tc .op{font:500 9.5px var(--bf);color:var(--t2)}
.tc.sel{background:var(--acc);color:var(--acct)}.tc.sel .op{color:var(--acct);opacity:.75}
.tc.used{opacity:.4}
.pct{position:absolute;top:4px;right:4px;font:700 9px var(--bf);padding:1px 4px;border-radius:5px;background:var(--card2);color:var(--t)}
.form{display:flex;gap:2px;justify-content:center;margin-top:4px}.form i{width:6px;height:6px;border-radius:50%}
.deck{position:relative;height:360px;margin:6px 8px 0}
.dk{position:absolute;inset:0;border-radius:22px;padding:18px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.45)}
.dk.b1{transform:translateY(14px) scale(.94);opacity:.55}.dk.b2{transform:translateY(28px) scale(.88);opacity:.3}
.dk .bigc{--s:120px;align-self:center}
.dk h3{font:800 38px var(--hf);text-transform:uppercase;line-height:.95}
.dk .pbar{height:8px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden}.dk .pbar i{display:block;height:100%;background:#fff}
.dkb{display:flex;justify-content:center;gap:26px;margin:40px 0 0}.dkb button{width:62px;height:62px;border-radius:50%;font-size:24px;background:var(--card2);display:flex;align-items:center;justify-content:center}.dkb button.y{background:var(--acc);color:var(--acct)}
.prl{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid color-mix(in srgb,var(--t) 7%,transparent)}
.prl .bw{height:6px;border-radius:3px;background:var(--card2);margin-top:4px;overflow:hidden}.prl .bw i{display:block;height:100%;border-radius:3px}
.prl b{font:600 13.5px var(--bf)}.prl.sel{background:color-mix(in srgb,var(--acc) 18%,transparent);border-radius:10px}
.prl .pc{font:700 15px var(--hf);min-width:40px;text-align:right}
.whl{position:relative;height:360px;overflow:hidden;perspective:500px;margin-top:8px}
.whl .it{position:absolute;left:0;right:0;top:50%;display:flex;align-items:center;justify-content:center;gap:10px;height:56px;margin-top:-28px;font:700 20px var(--hf);text-transform:uppercase;transform-origin:50% 50% -150px}
.whl .lens{position:absolute;left:10px;right:10px;top:50%;height:66px;margin-top:-33px;border-radius:18px;border:2px solid var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.map{position:relative;margin:4px auto;width:300px;height:354px}
.map svg{position:absolute;inset:0}
.map .pin{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}
.map .pin.sel::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--acc);animation:pulse 1.4s infinite}
@keyframes pulse{from{transform:scale(.8);opacity:1}to{transform:scale(1.6);opacity:0}}
.spl{display:flex;height:50px;border-radius:12px;overflow:hidden;margin-bottom:6px;background:var(--card)}
.spl>div{flex:1;display:flex;align-items:center;gap:7px;padding:0 9px;font:600 13px var(--bf);position:relative}
.spl>div:last-child{justify-content:flex-end}
.spl>div.sel{background:var(--acc);color:var(--acct)}.spl>div.used{opacity:.35}
.spl .tm{width:52px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 10px var(--bf);color:var(--t2);padding:0;background:var(--card2)}
/* calendario */
.mds{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:2px 12px 10px}.mds::-webkit-scrollbar{display:none}
.mds span{min-width:40px;height:40px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;font:600 16px var(--hf)}.mds span.on{background:var(--acc);color:var(--acct)}
.c1{display:grid;grid-template-columns:44px 1fr 56px 1fr 44px;align-items:center;padding:10px 4px;border-bottom:1px solid color-mix(in srgb,var(--t) 7%,transparent);text-align:center}
.c1 .t{display:flex;flex-direction:column;align-items:center;gap:3px;font:500 12px var(--bf);position:relative}
.c1 .sc{font:700 20px var(--hf)}.c1 .v{font:700 9.5px var(--bf);letter-spacing:.4px}
.c1 .me::before{content:"";position:absolute;top:-6px;width:48px;height:48px;border-radius:50%;box-shadow:0 0 0 2px var(--acc),0 0 16px var(--acc)}
.tl{position:relative;padding-left:52px}
.tl::before{content:"";position:absolute;left:40px;top:0;bottom:0;width:2px;background:color-mix(in srgb,var(--t) 12%,transparent)}
.tl .dy{font:700 13px var(--hf);text-transform:var(--up);letter-spacing:var(--ls);color:var(--acc);margin:12px 0 6px -40px}

  let h = `<div class="hd2">1 · Il mondo<small>Ogni mondo cambia tutto insieme e sceglie le parti più adatte; poi puoi cambiarle una per una qui sotto.</small></div><div class="worlds">${WORLDS.map(([k, t, d, bg, ac]) => `<button class="wd ${S.W === k ? 'on' : ''}" data-w="${k}" style="background:${bg};color:${['W4','W5'].includes(k) ? '#1b1b1b' : '#fff'}"><i style="color:${ac}">${k}</i><b style="color:${ac}">${t}</b><span>${d}</span></button>`).join('')}</div>`;
  h += `<div class="hd2">2 · Le parti<small>In arancio la scelta attiva. Tocca per vederla nel telefono.</small></div>`;
  GR.forEach(([k, t, d, tab, ops, multi]) => {
    h += `<div class="grp"><h3>${t}<small>${multi ? 'PIÙ SCELTE' : k}</small></h3><p>${d}</p><div class="ops">${ops.map(([c, n, e]) => { const sel = multi ? S[k].includes(c) : v(k) === c, dflt = !multi && w[5][k] === c;
      return `<button class="o ${sel ? 'on' : ''}" data-k="${k}" data-c="${c}" data-t="${tab}"><b>${c}</b>${n}${dflt ? ' <span style="font-size:10px;opacity:.7">· del mondo</span>' : ''}<em>${e}</em>${k === 'M' ? `<span class="pl" data-play="${c}">▶ prova</span>` : ''}</button>`; }).join('')}</div></div>`;
  });
  document.getElementById('opts').innerHTML = h;
}
function play(m) {
  const ph = document.getElementById('ph'), fx = document.createElement('div'), t = TM[PICK];
  fx.className = 'fx';
  if (m === 'M1') { fx.innerHTML = `<div class="crk"><svg viewBox="0 0 360 720" style="position:absolute;inset:0;width:100%;height:100%"><path d="M180 300 L140 210 L150 120 L120 0 M180 300 L260 250 L300 180 L360 160 M180 300 L230 400 L210 520 L250 720 M180 300 L90 360 L40 470 L0 500 M180 300 L120 330" stroke="#fff" stroke-width="2.5" fill="none" opacity=".85"/></svg>${cr('JUV', 90, 'fall')}<div class="msg" style="color:var(--red)">Eliminato</div></div>`; fx.style.background = 'rgba(0,0,0,.55)'; }
  if (m === 'M2') { fx.innerHTML = Array.from({ length: 70 }, (_, i) => `<i class="cf" style="left:${Math.random() * 100}%;background:${[t[2], t[3], '#fff'][i % 3]};animation-duration:${1.6 + Math.random() * 1.6}s;animation-delay:${Math.random() * .6}s;transform:rotate(${Math.random() * 180}deg)"></i>`).join('') + `<div class="msg" style="color:var(--acc)">Avanti!<div style="font:500 14px Barlow;color:var(--t);letter-spacing:0;text-transform:none;margin-top:6px">Bologna ha vinto 3-1 · sei alla 11ª</div></div>`; }
  if (m === 'M3') { fx.innerHTML = `<div class="stamp">Scelta fatta<small>BOLOGNA · G10</small></div>`; fx.style.background = 'rgba(0,0,0,.35)'; }
  if (m === 'M4') fx.innerHTML = `<div class="goal">${cr(PICK, 40)}<div class="grow">GOL! Bologna<div style="font-weight:500;font-size:12px">Castro 23’ · la tua squadra</div></div><b>1-0</b></div>`;
  if (m === 'M5') fx.innerHTML = `<div class="rev">${cr(PICK, 90)}<b style="color:var(--grn)">3 - 1</b><div class="hf" style="font-size:20px">Bologna – Monza</div><div class="ok">Sei salvo</div></div><div class="cur l"></div><div class="cur r"></div>`;
  if (m === 'M6') fx.innerHTML = `<div class="spot"></div><div class="crown"><i>👑</i>${AV('Bomber', 100)}<div class="hf" style="font-size:30px;color:#ffd60a;margin-top:10px">Bomber</div><div style="font-size:13px">ultimo sopravvissuto · 40 battuti</div></div>`;
  ph.appendChild(fx); setTimeout(() => fx.remove(), 3400);
}
document.addEventListener('click', e => {
  const p = e.target.closest('[data-play]'); if (p) { e.stopPropagation(); play(p.dataset.play); return; }
  const g = e.target.closest('[data-go]'); if (g) { S.tab = g.dataset.go; render(); return; }
  const w = e.target.closest('[data-w]'); if (w) { S.W = w.dataset.w; S.o = {}; render(); return; }
  const o = e.target.closest('.o'); if (o) { const { k, c, t } = o.dataset;
    if (k === 'M' || k === 'F') { S[k] = S[k].includes(c) ? S[k].filter(x => x !== c) : [...S[k], c]; if (k === 'M' && S.M.includes(c)) play(c); if (k === 'F') S.tab = { F1:'pick', F2:'pro', F5:'pro', F6:'home', F7:'home', F8:'pick' }[c] || S.tab; }
    else S.o[k] = c;
    if (t) S.tab = t; render(); return; }
});
document.getElementById('cp').onclick = () => { const t = document.getElementById('code').innerText.replace('Codice: ', ''); navigator.clipboard && navigator.clipboard.writeText(t); document.getElementById('cp').textContent = 'Copiato ✓'; setTimeout(() => document.getElementById('cp').textContent = 'Copia il codice', 1500); };
document.getElementById('rs').onclick = () => { S.o = {}; render(); };
// #W3/pick/P2/C5 apre direttamente un mondo, una schermata e delle parti
location.hash.slice(1).split('/').filter(Boolean).forEach(x => { if (/^W\d$/.test(x)) S.W = x; else if (SCR.some(s => s[0] === x)) S.tab = x; else if (/^[A-Z]\d$/.test(x)) S.o[x[0]] = x; });
setInterval(() => { const c = document.getElementById('cdn'); if (c) c.innerHTML = countdown().map(([n, l]) => `<div><b>${String(n).padStart(2,'0')}</b><small>${l}</small></div>`).join(''); }, 1000);
render();
</script>
