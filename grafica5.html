<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Football Survivor · Nuova grafica</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Semi+Condensed:wght@400;500;600;700;800&family=Bungee&family=Russo+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0a0a0b;color:#eee;font-family:Barlow,sans-serif;font-size:14px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 14px 60px;display:grid;gap:16px}
@media(min-width:880px){.wrap{grid-template-columns:400px 1fr}.stage{position:sticky;top:12px;align-self:start}}
h1{font:600 22px "Barlow Semi Condensed";text-align:center}h1 i{font-style:normal;color:#ff9f1c}
.lead{color:#9aa0aa;font-size:13px;margin:4px 0 10px;text-align:center;line-height:1.4}
.stage{position:sticky;top:0;z-index:5;background:#0a0a0b;padding:6px 0 10px}
@media(max-width:879px){.stage .phone{height:min(58vh,640px)}}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.tabs button{padding:7px 14px;border-radius:999px;background:#1a1c21;font:500 13px Barlow}.tabs button.on{background:#ff9f1c;color:#000}
.code{margin:8px 0 0;font:500 12.5px Barlow;color:#9aa0aa;text-align:center;line-height:1.5}.code b{color:#fff;letter-spacing:.3px}
.cp{display:block;margin:6px auto 0;padding:6px 14px;border-radius:999px;background:#1a1c21;font:500 12px Barlow}
.grp{background:#131417;border-radius:16px;padding:12px;margin-bottom:10px}
.grp h3{font:600 14px Barlow;margin-bottom:2px}.grp p{font-size:12px;color:#8a909a;margin-bottom:8px}
.grp .sect{font:600 11px Barlow;letter-spacing:1.4px;color:#ff9f1c;margin:4px 0 6px}
.o{display:block;width:100%;text-align:left;padding:9px 12px;margin-bottom:5px;border-radius:12px;background:#1b1d22;font-size:13px;line-height:1.35}
.o b{color:#ff9f1c;margin-right:7px;font-family:"Barlow Semi Condensed";font-size:15px}.o.on{background:#ff9f1c;color:#000}.o.on b{color:#000}
.hd2{font:700 17px "Barlow Semi Condensed";letter-spacing:.5px;margin:18px 2px 8px;color:#fff}
/* ── telefono ── */
.phone{width:min(100%,375px);height:720px;margin:0 auto;border-radius:38px;border:8px solid #1d1f24;background:var(--bg);position:relative;overflow:hidden}
.scr{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding-bottom:96px;color:#f2f3f5;background:var(--bgimg,none),var(--bg)}
.scr::-webkit-scrollbar{display:none}
.phone{--acc:#ff9f1c;--bg:#000;--card:#121316;--card2:#1c1e23;--t2:#9097a3;--grn:#3ddc84;--red:#ff4d5a;--pnk:#ff4fa3;--yel:#ffd60a;--r:14px;--hf:"Barlow Semi Condensed"}
.notch{height:34px}
.hd{display:flex;flex-direction:column;align-items:center;padding:4px 0 8px;line-height:1}
.hd .a{font:500 10px Barlow;letter-spacing:4px;color:#fff}.hd .b{font:700 26px var(--hf);letter-spacing:2px;color:var(--acc)}.hd .c{font:500 10px Barlow;letter-spacing:1.5px;margin-top:2px}
.pad{padding:0 10px}
.cd{background:var(--card);border-radius:var(--r);padding:10px}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.crest{width:var(--s,28px);height:var(--s,28px);object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 0 1px rgba(255,255,255,.7))}
.av{width:var(--s,40px);height:var(--s,40px);border-radius:50%;background:var(--ab,#ffd60a);display:flex;align-items:center;justify-content:center;font-size:calc(var(--s,40px)*.55);flex:0 0 auto;position:relative}
.sec{display:flex;align-items:center;gap:10px;margin:16px 2px 8px;font:500 11px Barlow;letter-spacing:1.3px;color:var(--t2);text-transform:uppercase}
.sec::before,.sec::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.1)}
.nav{position:absolute;left:10px;right:10px;bottom:12px;display:flex;gap:3px;padding:5px;border-radius:22px;background:rgba(24,26,31,.96);border:1px solid rgba(255,255,255,.1)}
.nav span{flex:1;height:42px;border-radius:17px;display:flex;align-items:center;justify-content:center;font:500 12px Barlow;color:#8a909a}.nav span.on{flex:0 0 112px;background:var(--acc);color:#000}
.n{font-family:var(--hf);font-weight:600}
.g{color:var(--grn)}.rd{color:var(--red)}.y{color:var(--yel)}.m{color:var(--t2)}.ac{color:var(--acc)}.pk{color:var(--pnk)}
.tag{font:600 9.5px Barlow;letter-spacing:.5px;background:var(--acc);color:#000;border-radius:5px;padding:1px 5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;border-radius:12px;background:var(--card2);font:500 13px Barlow}
/* toni (T) */
.t2 .scr{--bgimg:repeating-linear-gradient(180deg,rgba(40,120,60,.10) 0 70px,rgba(40,120,60,.03) 70px 140px)}
.t2{--bg:#04110a;--card:#0b1d12;--card2:#123020}
.t3 .scr{--bgimg:radial-gradient(120% 50% at 50% -10%,rgba(255,200,120,.25),transparent 60%)}
.t3{--bg:#06070c;--card:#10121b;--card2:#191c28}
.t4{--hf:"Russo One";--r:6px;--card:#101114;--card2:#1b1d22}
.t4 .cd{border:2px solid #2a2d34}
.t5{--acc:#ffd60a;--bg:#0b0b14;--card:#161629;--card2:#212142;--hf:"Bungee";--r:16px}
.t5 .cd{box-shadow:0 4px 0 rgba(0,0,0,.5)}
/* elementi speciali */
.led{font:400 26px "Bungee";letter-spacing:1px;color:var(--yel);text-shadow:0 0 10px rgba(255,214,10,.6)}
.ticket{position:relative;background:var(--card);border-radius:var(--r);display:flex;overflow:hidden}
.ticket .l{flex:1;padding:12px}.ticket .r{width:92px;border-left:2px dashed rgba(255,255,255,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px}
.ticket::before,.ticket::after{content:"";position:absolute;right:83px;width:18px;height:18px;border-radius:50%;background:var(--bg)}.ticket::before{top:-9px}.ticket::after{bottom:-9px}
.ring{--p:60;width:118px;height:118px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),rgba(255,255,255,.08) 0);display:flex;align-items:center;justify-content:center;margin:0 auto}
.ring>div{width:100px;height:100px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.fut{background:linear-gradient(160deg,#f6d27a,#b8862b);color:#2a1d04;border-radius:16px;padding:12px;position:relative;overflow:hidden}
.fut::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%)}
.stk2{display:flex}.stk2 img{margin-left:-8px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 10px);mask-image:linear-gradient(90deg,transparent 0,#000 10px)}.stk2 img:first-child{margin-left:0;-webkit-mask-image:none;mask-image:none}
.dots{display:flex;gap:4px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--grn)}.dots i.x{background:var(--red)}.dots i.w{background:#3a3d45}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:9px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--card2);font:500 12px Barlow}
.used{filter:grayscale(1) brightness(.45)}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <h1>Nuova <i>grafica</i></h1>
    <p class="lead">Scegli un'opzione per ogni gruppo: il telefono mostra subito il risultato. Passa da Home a Classifiche a Profilo con i bottoni.</p>
    <div class="tabs"><button id="b-home" onclick="pg='home';draw()">Home</button><button id="b-cla" onclick="pg='cla';draw()">Classifiche</button><button id="b-pro" onclick="pg='pro';draw()">Profilo</button></div>
    <div class="phone" id="phone"></div>
    <p class="code">La tua scelta:<br><b id="code"></b></p>
    <button class="cp" onclick="copyCode()">Copia la scelta</button>
  </div>
  <div id="ctl"></div>
</div>
<script>
const C = t => `https://crests.football-data.org/${{ MIL: 98, FIO: 99, ROM: 100, ATA: 102, BOL: 103, CAG: 104, GEN: 107, INT: 108, JUV: 109, LAZ: 110, PAR: 112, NAP: 113, UDI: 115, VEN: 454, FRO: 470, SAS: 471, TOR: 586, LEC: 5890, MON: 5911, COM: 7397 }[t]}.png`;
const cr = (t, s, cls) => `<img class="crest ${cls || ''}" style="--s:${s || 28}px" src="${C(t)}" alt="">`;
const ALL = ['ATA', 'BOL', 'CAG', 'COM', 'FIO', 'FRO', 'GEN', 'INT', 'JUV', 'LAZ', 'LEC', 'MIL', 'MON', 'NAP', 'PAR', 'ROM', 'SAS', 'TOR', 'UDI', 'VEN'];
const USED = { NAP: 5, LAZ: 6, TOR: 7, MIL: 8 }, PICK = 'ROM';
const HIST = [[8, 'MIL', 'vs Udinese (fuori)', '1-0', 1], [7, 'TOR', 'vs Monza (casa)', '2-1', 1], [6, 'LAZ', 'vs Parma (casa)', '3-1', 1], [5, 'NAP', 'vs Roma (casa)', '2-0', 1]];
const PL = [['😎', '#ffd60a', 'IlBomber', 3, 3, 1, ['ROM', 'INT']], ['🤓', '#7dd3fc', 'giuly', 1, 1, 1, ['JUV']], ['😏', '#f9a8d4', 'paolo_c', 2, 1, 1, ['ROM']], ['🙃', '#86efac', 'Padel51', 1, 1, 1, ['NAP']], ['😬', '#fca5a5', 'luca99', 1, 0, 0, []], ['🥲', '#c4b5fd', 'sara.g', 1, 0, 0, []]];
const av = (e, b, s) => `<div class="av" style="--s:${s}px;--ab:${b}">${e}</div>`;
// gruppi di proposte: [lettera, pagina, titolo, descrizione, opzioni]
const G = [
  ['T', null, 'Tono generale', 'Cambia il «sapore» di tutta l\'app, insieme a tutto il resto.', [
    ['T1', 'Attuale: nero e arancio, pulito'], ['T2', 'Campo da calcio: fondo verde scurissimo a strisce come l\'erba tagliata'], ['T3', 'Stadio di notte: luce dei riflettori che scende dall\'alto'], ['T4', 'Arcade: caratteri squadrati, bordi marcati, angoli piccoli'], ['T5', 'Videogioco: giallo acceso su viola notte, caratteri da sala giochi']]],
  ['H', 'home', 'Home · la tua scheda', 'Nickname, turni passati, vite, giocatori in gioco.', [
    ['H1', 'Attuale: avatar grande e la riga con i tre numeri'], ['H2', 'Compatta: avatar piccolo, nickname e tre bollini colorati'], ['H3', 'Tabellone dello stadio: tre numeri luminosi TURNI · VITE · IN GIOCO'], ['H4', 'Figurina: card dorata stile carta da collezione con le statistiche'], ['H5', 'Una riga sola: avatar, nickname e numeri in fila']]],
  ['S', 'home', 'Home · la squadra scelta', 'Giornata, vita, partita, data e ora, matita per cambiare.', [
    ['S1', 'Attuale: card con i colori della squadra'], ['S2', 'Biglietto dello stadio: a destra il talloncino con la scadenza'], ['S3', 'Come il Calendario: stemma – ora – stemma, la tua nel riquadro arancio'], ['S4', 'Cerchio della scadenza: lo stemma al centro di un anello che si svuota'], ['S5', 'Grande e semplice: stemma enorme, sotto partita e conto alla rovescia']]],
  ['P', 'home', 'Home · scelte precedenti', '', [
    ['P1', 'Attuale: una card per giornata'], ['P2', 'Percorso: stemmi in fila con ✓/✗ come le tappe di un viaggio'], ['P3', 'Righe sottili: giornata, stemma, risultato, una sotto l\'altra senza card'], ['P4', 'Album: bollini 4 per riga con il numero della giornata']]],
  ['Q', 'home', 'Home · squadre', '', [
    ['Q1', 'Attuale: griglia 5 per riga, usate con la X rossa'], ['Q2', 'Album di figurine: le usate sono «attaccate» con la giornata, le altre a contorno vuoto'], ['Q3', 'Compatta: 10 stemmi piccoli per riga'], ['Q4', 'Contatore + striscia: «16 squadre rimaste» e gli stemmi che scorrono']]],
  ['L', 'cla', 'Classifiche · elenco leghe', '', [
    ['L1', 'Attuale: tendina per ogni lega'], ['L2', 'Linguette scorrevoli in alto (una per lega, pallino verde/rosso)'], ['L3', 'Una riga «Lega: Survivor del Bar ▾» che apre l\'elenco']]],
  ['D', 'cla', 'Classifiche · podio', '', [
    ['D1', 'Attuale: podio con i gradini colorati'], ['D2', 'Niente podio: medaglie 🥇🥈🥉 sulle prime tre righe'], ['D3', 'Banner del primo: «In testa» con avatar grande e coppa'], ['D4', 'Podio con piedistalli in 3D e coriandoli']]],
  ['R', 'cla', 'Classifiche · righe', 'Posizione, avatar, nickname, stato, vite, squadre scelte, giornata.', [
    ['R1', 'Attuale: card per ogni giocatore'], ['R2', 'Righe compatte tipo tabella, separate da una linea'], ['R3', 'Vite come pallini: verdi le vive, grigie le perse'], ['R4', 'Barra del percorso: quanto manca alla 20ª giornata'], ['R5', 'Tabellone dello stadio: numeri luminosi, eliminati sbarrati']]],
  ['A', 'pro', 'Profilo · avatar', 'Più compatto, come chiesto.', [
    ['A1', 'Attuale: avatar grande al centro e bottone sotto'], ['A2', 'Riga compatta: avatar a sinistra con la matita sopra, nickname a destra'], ['A3', 'Figurina: piccola card dorata con l\'avatar, tocchi per modificarlo'], ['A4', 'Avatar con anello delle vite intorno e matita nell\'angolo']]],
  ['K', 'pro', 'Profilo · dati per entrare', '', [
    ['K1', 'Attuale: tre righe con Copia'], ['K2', 'Tre pillole affiancate, tocchi per copiare'], ['K3', 'Nascosti: «Mostra i miei codici 🔒», si aprono a richiesta']]],
  ['V', 'pro', 'Profilo · vite e regole', '', [
    ['V1', 'Attuale: cuori grandi e regole in elenco'], ['V2', 'Una riga di vite + regole a fisarmonica (si aprono toccando)'], ['V3', 'Regole come 4 riquadri con icona (1 squadra, se vince passi, una volta sola, scadenza)']]],
];
let st = { T: 'T1', H: 'H1', S: 'S1', P: 'P1', Q: 'Q1', L: 'L1', D: 'D1', R: 'R1', A: 'A1', K: 'K1', V: 'V1' }, pg = 'home';
try { Object.assign(st, JSON.parse(localStorage.getItem('fs-graf5') || '{}')); } catch (e) { }
location.hash.slice(1).split(',').forEach(c => { if (/^[A-Z][0-9]$/.test(c) && st[c[0]]) st[c[0]] = c; if (['home', 'cla', 'pro'].includes(c)) pg = c; });
const header = () => `<div class="hd"><span class="a">FOOTBALL</span><b class="b">SURVIVOR</b><span class="c">FAI LA TUA SCELTA!</span></div>`;
// ── HOME
function homeCard() {
  switch (st.H) {
    case 'H1': return `<div class="cd"><div class="row">${av('😎', '#ffd60a', 64)}<div class="grow"><div style="font:600 22px var(--hf)">IlBomber</div><div style="font:500 11.5px Barlow;letter-spacing:.4px;color:var(--t2)"><b class="n ac" style="font-size:14px">4/20</b> TURNI PASSATI · <b class="n pk" style="font-size:14px">3</b> VITE · <b class="n g" style="font-size:14px">4/6</b> IN GIOCO</div></div></div>`;
    case 'H2': return `<div class="cd"><div class="row">${av('😎', '#ffd60a', 44)}<div class="grow" style="font:600 19px var(--hf)">IlBomber</div><span class="chip"><b class="n ac">4</b>/20</span><span class="chip"><b class="n pk">3</b>❤</span><span class="chip"><b class="n g">4</b>/6</span></div>`;
    case 'H3': return `<div class="cd" style="background:#0c0d10;border:1px solid #23252b"><div class="row" style="margin-bottom:8px">${av('😎', '#ffd60a', 34)}<b style="font:600 18px var(--hf)">IlBomber</b></div><div style="display:grid;grid-template-columns:repeat(3,1fr);text-align:center;background:#000;border-radius:10px;padding:8px 0">${[['04', 'TURNI'], ['03', 'VITE'], ['04', 'IN GIOCO']].map(([v, l]) => `<div><div class="led">${v}</div><div style="font:500 9.5px Barlow;letter-spacing:1.5px;color:#777">${l}</div></div>`).join('')}</div>`;
    case 'H4': return `<div class="fut"><div class="row" style="position:relative;z-index:1"><div style="text-align:center"><div style="font:800 30px var(--hf);line-height:.9">87</div><div style="font:700 10px Barlow;letter-spacing:1px">SURV</div></div>${av('😎', '#fff3c4', 70)}<div class="grow"><div style="font:800 21px var(--hf);text-transform:uppercase">IlBomber</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;font:700 11px Barlow;margin-top:4px"><span>TUR <b>4</b></span><span>VIT <b>3</b></span><span>GIO <b>4/6</b></span></div></div></div></div><div class="cd" style="margin-top:8px">`;
    case 'H5': return `<div class="row" style="padding:2px 4px 10px">${av('😎', '#ffd60a', 30)}<b style="font:600 17px var(--hf)" class="grow">IlBomber</b><span class="n ac">4/20</span><span class="m">·</span><span class="n pk">3❤</span><span class="m">·</span><span class="n g">4/6</span></div><div class="cd">`;
  }
}
function lives() { return `<div class="row" style="gap:6px;margin:10px 0">${[1, 2, 3].map(k => `<span class="chip" style="${k === 1 ? 'background:var(--acc);color:#000' : ''}">${cr(k === 3 ? 'INT' : 'ROM', 18)}${k}° VITA</span>`).join('')}<span class="chip" style="background:var(--acc);color:#000;width:30px;justify-content:center">+</span></div>`; }
function homePick() {
  switch (st.S) {
    case 'S1': return `<div style="border-radius:var(--r);padding:12px;display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#7a1424 0 55%,#d6a74a 55%)">${cr('ROM', 64)}<div class="grow"><div style="font:500 11.5px Barlow;letter-spacing:.6px">9ª GIORNATA · 1° VITA</div><b style="font:600 21px var(--hf)">ROMA - CAGLIARI</b><div style="font:500 12px Barlow">MARTEDÌ 27/10 ORE 20:45</div></div><span>✏️</span></div>`;
    case 'S2': return `<div class="ticket"><div class="l"><div style="font:600 10.5px Barlow;letter-spacing:1.5px;color:var(--acc)">BIGLIETTO · 9ª GIORNATA · 1° VITA</div><div class="row" style="margin:8px 0 4px">${cr('ROM', 38)}<b style="font:600 20px var(--hf)">ROMA</b><span class="m">vs</span><span style="font:500 15px Barlow">Cagliari</span></div><div class="m" style="font-size:12px">MARTEDÌ 27/10 · ORE 20:45 · OLIMPICO</div></div><div class="r"><div style="font:500 9.5px Barlow;letter-spacing:1px" class="m">SCADE TRA</div><b class="n ac" style="font-size:20px">1G 6H</b><span style="font-size:15px">✏️</span></div></div>`;
    case 'S3': return `<div class="cd"><div style="font:500 11px Barlow;letter-spacing:1px;color:var(--t2);text-align:center;margin-bottom:6px">9ª GIORNATA · 1° VITA · LA TUA SCELTA</div><div style="display:grid;grid-template-columns:1fr 70px 1fr;align-items:center;text-align:center"><div style="border-radius:12px;padding:8px 2px;box-shadow:inset 0 0 0 2px var(--acc);background:rgba(255,159,28,.1);position:relative"><span class="tag" style="position:absolute;top:-6px;left:50%;transform:translateX(-50%)">TU</span>${cr('ROM', 40)}<div style="font:500 14px Barlow">Roma</div></div><div><div class="m" style="font-size:11.5px;line-height:1.3">Mar 27/10<br>20:45</div></div><div style="padding:8px 2px">${cr('CAG', 40)}<div style="font:500 14px Barlow">Cagliari</div></div></div><div style="text-align:center;margin-top:6px;font-size:12px" class="m">Puoi cambiarla fino a martedì alle 18:30 ✏️</div></div>`;
    case 'S4': return `<div class="cd" style="text-align:center"><div style="font:500 11px Barlow;letter-spacing:1px" class="m">9ª GIORNATA · 1° VITA</div><div class="ring" style="--p:65;margin:10px auto"><div>${cr('ROM', 48)}<b class="n ac" style="font-size:14px;margin-top:4px">1G 6H</b></div></div><b style="font:600 19px var(--hf)">ROMA - CAGLIARI</b><div class="m" style="font-size:12px">MARTEDÌ 27/10 · ORE 20:45 · ✏️ cambia</div></div>`;
    case 'S5': return `<div style="text-align:center;padding:6px 0 2px">${cr('ROM', 110)}<div style="font:700 26px var(--hf);margin-top:6px">ROMA</div><div class="m" style="font-size:13px">contro Cagliari · martedì 20:45</div><div style="margin-top:8px"><span class="chip">⏳ scade tra <b class="ac">1g 6h</b></span> <span class="chip">✏️ cambia</span></div></div>`;
  }
}
function homeHist() {
  switch (st.P) {
    case 'P1': return `<div style="display:grid;gap:5px">${HIST.map(([md, t, v, r]) => `<div class="cd row"><b class="n" style="font-size:22px;width:24px;text-align:center">${md}</b>${cr(t, 30)}<div class="grow"><div style="font:500 15px Barlow">${{ MIL: 'Milan', TOR: 'Torino', LAZ: 'Lazio', NAP: 'Napoli' }[t]}</div><div class="m" style="font-size:12px">${v} · ${r} · Vinta</div></div><span style="width:28px;height:28px;border-radius:50%;background:var(--grn);color:#000;display:flex;align-items:center;justify-content:center">✓</span></div>`).join('')}</div>`;
