<style>
:root{
  --bg:#000;--card:#111317;--card2:#181b21;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);
  --t:#f4f5f7;--t2:#a3a8b3;--t3:#6b7280;
  --yel:#ffd60a;--cya:#22d3ee;--pnk:#ff4fa3;--grn:#3ddc84;--red:#ff4d5a;--org:#ff9f1c;--vio:#a78bfa;
  --pc:var(--yel);
  --app-h:100dvh;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--t);font-family:"Barlow",system-ui,sans-serif;font-size:15px;overscroll-behavior:none}
body{position:fixed;inset:0;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;font-size:16px;color:var(--t)}
#app{position:absolute;left:0;right:0;top:0;height:var(--app-h);overflow:hidden;display:flex;flex-direction:column}
body[data-tab="home"]{--pc:var(--yel)}body[data-tab="leg"]{--pc:var(--org)}body[data-tab="cal"]{--pc:var(--cya)}body[data-tab="cla"]{--pc:var(--pnk)}body[data-tab="pro"]{--pc:var(--grn)}

/* testata */
.hdr{flex:0 0 auto;padding:calc(var(--st) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;background:#000;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;min-width:0}
.logo svg{width:30px;height:30px;flex:0 0 auto}
.logo b{font-family:"Oswald",sans-serif;font-weight:700;font-size:20px;letter-spacing:.5px;line-height:1;white-space:nowrap}
.logo b i{font-style:normal;color:var(--yel)}
.hdr .lg{margin-left:auto;font-family:"Barlow Semi Condensed";font-weight:700;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%;text-align:right}
.hdr .lg em{display:block;font-style:normal;color:var(--pc);font-size:11px}
.demo{background:var(--org);color:#000;font:700 11px "Barlow Semi Condensed";letter-spacing:.5px;text-transform:uppercase;text-align:center;padding:3px 8px}

/* contenuto */
.main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(110px + var(--sb))}
.page{display:none}.page.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ttl{font-family:"Oswald",sans-serif;font-weight:700;font-size:30px;line-height:1;text-transform:uppercase;letter-spacing:.5px;margin:2px 0 14px}
.ttl span{color:var(--pc)}
.sec{font:800 12px "Barlow Semi Condensed";letter-spacing:1.2px;text-transform:uppercase;color:var(--t2);margin:22px 2px 8px;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.muted{color:var(--t2)}.small{font-size:13px}.tiny{font-size:12px}.c{text-align:center}
.num{font-family:"Barlow Semi Condensed";font-weight:800}

/* bottoni */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:16px;background:var(--pc);color:#000;font:800 15px "Barlow Semi Condensed";letter-spacing:.6px;text-transform:uppercase;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.g{background:var(--card2);color:var(--t);border:1px solid var(--line2)}
.btn.r{background:var(--red);color:#fff}
.btn.sm{width:auto;padding:9px 14px;border-radius:12px;font-size:13px}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.mt{margin-top:12px}.mt2{margin-top:20px}

/* campi */
.fld{display:block;margin-top:12px}
.fld span{display:block;font:700 12px "Barlow Semi Condensed";letter-spacing:.8px;text-transform:uppercase;color:var(--t2);margin:0 0 6px 4px}
.fld input,.fld select{width:100%;min-width:0;-webkit-appearance:none;appearance:none;background:var(--card2);border:1px solid var(--line2);border-radius:14px;padding:14px;outline:none}
.fld input:focus,.fld select:focus{border-color:var(--pc)}
.code-in{text-align:center;font:800 28px "Barlow Semi Condensed"!important;letter-spacing:10px}

/* menu a pillole (come Laurera) */
.nav{position:absolute;left:14px;right:14px;bottom:calc(14px + var(--sb));z-index:50;max-width:460px;margin:0 auto}
.nav .bar{display:flex;gap:3px;padding:5px;border-radius:24px;background:rgba(18,20,24,.92);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 30px rgba(0,0,0,.6)}
.nav .tb{--tc:var(--yel);flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 0;border-radius:18px;color:var(--tc);transition:flex .25s ease,background .2s}
.nav .tb svg{width:22px;height:22px;flex:0 0 auto}
.nav .tb .tl{display:none;font:800 12.5px "Barlow Semi Condensed";letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.nav .tb.on{flex:0 0 auto;padding:14px 16px;background:var(--tc);color:#000;box-shadow:0 0 18px color-mix(in srgb,var(--tc) 55%,transparent)}
.nav .tb.on .tl{display:inline}
.nav .tb[data-t="leg"]{--tc:var(--org)}.nav .tb[data-t="cal"]{--tc:var(--cya)}
.lgc{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.lgc.on{border-color:var(--org);box-shadow:0 0 0 1px var(--org) inset}
.lgc .ic{width:44px;height:44px;flex:0 0 auto;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;font:700 20px Oswald;color:var(--org)}
.lgc b{display:block;font:700 18px Oswald;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nav .tb[data-t="cla"]{--tc:var(--pnk)}.nav .tb[data-t="pro"]{--tc:var(--grn)}
.nav .tb:active{transform:scale(.94)}

/* scudetti */
.crest{width:var(--s,34px);height:var(--s,34px);flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center}
.crest img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 1px rgba(255,255,255,.75)) drop-shadow(0 0 3px rgba(255,255,255,.25))}
.crest .ph{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 calc(var(--s,34px)*.32) "Barlow Semi Condensed";color:#fff;border:2px solid rgba(255,255,255,.25)}

/* home */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:18px;background:linear-gradient(135deg,#1b1d22,#0d0e11);border:1px solid var(--line2)}
.hero::before{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--hc,var(--yel)) 35%,transparent),transparent 70%)}
.hero .st{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--hc,var(--yel));color:#000;font:800 12px "Barlow Semi Condensed";letter-spacing:.8px;text-transform:uppercase}
.hero h2{font:700 26px "Oswald";text-transform:uppercase;margin:12px 0 2px;line-height:1.05}
.hero .who{display:flex;align-items:center;gap:12px}
.hero .av{width:62px;height:62px;flex:0 0 auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:rgba(255,255,255,.05);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font:800 22px "Barlow Semi Condensed";line-height:1.1}
.stat small{font:700 10.5px "Barlow Semi Condensed";letter-spacing:.7px;text-transform:uppercase;color:var(--t2)}
.pickbox{margin-top:12px;display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:rgba(255,255,255,.06);border:1px dashed rgba(255,255,255,.2)}
.pickbox.ok{border-style:solid;border-color:color-mix(in srgb,var(--grn) 60%,transparent);background:color-mix(in srgb,var(--grn) 10%,transparent)}
.pickbox b{font:700 18px "Oswald";text-transform:uppercase}
.cd{font:800 13px "Barlow Semi Condensed";color:var(--yel);letter-spacing:.4px}
.hist{display:flex;flex-direction:column;gap:6px}
.hi{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.hi .md{width:40px;flex:0 0 auto;font:800 13px "Barlow Semi Condensed";color:var(--t2);text-align:center;line-height:1.05}
.hi .md b{display:block;font-size:18px;color:var(--t)}
.hi .tn{font:700 15px "Barlow Semi Condensed";text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi .vs{font-size:12px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{flex:0 0 auto;min-width:30px;height:30px;padding:0 9px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font:800 13px "Barlow Semi Condensed";letter-spacing:.3px}
.b-win{background:var(--grn);color:#000}.b-ko{background:var(--red);color:#fff}.b-life{background:var(--pnk);color:#000}.b-live{background:var(--org);color:#000}.b-pass{background:var(--vio);color:#000}.b-wait{background:var(--card2);color:var(--t2);border:1px solid var(--line2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 5px;border-radius:999px;background:var(--card);border:1px solid var(--line);font:700 12.5px "Barlow Semi Condensed";text-transform:uppercase;white-space:nowrap}
.chip.used{opacity:.45;text-decoration:line-through}
.banner{border-radius:20px;padding:16px;background:linear-gradient(135deg,var(--yel),var(--org));color:#000;text-align:center}
.banner b{display:block;font:700 22px "Oswald";text-transform:uppercase}

/* calendario */
.mds{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 10px;margin:0 -16px;padding-left:16px;padding-right:16px;scroll-snap-type:x proximity}
.mds::-webkit-scrollbar{display:none}
.mdb{flex:0 0 auto;min-width:46px;padding:8px 10px;border-radius:14px;background:var(--card);border:1px solid var(--line);font:800 15px "Barlow Semi Condensed";text-align:center;scroll-snap-align:center;position:relative}
.mdb small{display:block;font-size:9.5px;letter-spacing:.6px;color:var(--t2);text-transform:uppercase}
.mdb.on{background:var(--cya);color:#000;border-color:var(--cya)}.mdb.on small{color:#000}
.mdb.open::after{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--yel)}
.mdb.mine{box-shadow:inset 0 0 0 2px var(--grn)}
.mdhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 10px}
.mdhead b{font:700 20px "Oswald";text-transform:uppercase}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font:800 11px "Barlow Semi Condensed";letter-spacing:.6px;text-transform:uppercase;white-space:nowrap}
.tag.y{background:var(--yel);color:#000}.tag.g{background:var(--card2);color:var(--t2);border:1px solid var(--line2)}.tag.o{background:var(--org);color:#000}
.day{font:800 12px "Barlow Semi Condensed";letter-spacing:1px;text-transform:uppercase;color:var(--cya);margin:16px 4px 6px}
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:6px;margin-bottom:8px}
.tm{display:flex;align-items:center;gap:8px;min-width:0;padding:10px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:left}
.tm.aw{flex-direction:row-reverse;text-align:right}
.tm .nm{font:700 14.5px "Barlow Semi Condensed";text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tm .nm small{display:block;font-size:10px;letter-spacing:.6px;color:var(--t3)}
.tm.can:active{transform:scale(.97)}
.tm.used{opacity:.38}
.tm.pick{background:color-mix(in srgb,var(--grn) 16%,var(--card));border-color:var(--grn);box-shadow:0 0 16px color-mix(in srgb,var(--grn) 30%,transparent)}
.tm.win .nm{color:var(--grn)}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:58px;padding:0 2px}
.mid .sc{font:800 22px "Barlow Semi Condensed";letter-spacing:1px;white-space:nowrap}
.mid .tm2{font:800 15px "Barlow Semi Condensed";white-space:nowrap}
.mid small{font:700 10px "Barlow Semi Condensed";letter-spacing:.5px;color:var(--t2);text-transform:uppercase;white-space:nowrap}
.live{color:var(--org)}

/* classifiche */
.rk{display:flex;flex-direction:column;gap:7px}
.rr{display:flex;align-items:center;gap:10px;padding:9px 12px 9px 10px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.rr.me{border-color:var(--pnk);box-shadow:0 0 0 1px var(--pnk) inset}
.rr.out{opacity:.55}
.rr .ps{width:26px;flex:0 0 auto;text-align:center;font:800 18px "Barlow Semi Condensed"}
.rr .av{width:42px;height:42px;flex:0 0 auto}
.rr .un{font:700 15px "Barlow Semi Condensed";white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr .sub{font-size:12px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr .gd{flex:0 0 auto;text-align:right;font:800 18px "Barlow Semi Condensed";line-height:1}
.rr .gd small{display:block;font-size:10px;letter-spacing:.6px;color:var(--t2);text-transform:uppercase}
.hearts{color:var(--pnk);font-size:12px;letter-spacing:1px}
.pod{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end;margin-bottom:14px}
.pd{text-align:center}
.pd .av{width:56px;height:56px;margin:0 auto 6px}
.pd .bl{border-radius:14px 14px 6px 6px;padding:8px 4px;font:800 22px "Barlow Semi Condensed";color:#000}
.pd .n{font:700 12.5px "Barlow Semi Condensed";white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}

/* profilo */
.pf{display:flex;flex-direction:column;align-items:center;text-align:center}
.pf .av{width:130px;height:130px}
.pf h2{font:700 24px "Oswald";text-transform:uppercase;margin-top:10px}
.lives{display:flex;justify-content:center;gap:6px;margin-top:6px;font-size:26px}
.lives i{font-style:normal;filter:drop-shadow(0 0 8px rgba(255,79,163,.6))}
.lives i.off{filter:grayscale(1);opacity:.25}
.rules li{margin:0 0 8px 18px;color:var(--t2)}.rules b{color:var(--t)}
.adm .rr{flex-wrap:wrap}

/* fogli dal basso */
.sh-bg{position:absolute;inset:0;z-index:100;background:rgba(0,0,0,.7);opacity:0;pointer-events:none;transition:opacity .2s}
.sh-bg.on{opacity:1;pointer-events:auto}
.sh{position:absolute;left:0;right:0;bottom:0;z-index:101;max-height:calc(var(--app-h) - var(--st) - 20px);overflow-y:auto;background:#121418;border-radius:26px 26px 0 0;border-top:1px solid var(--line2);padding:10px 18px calc(22px + var(--sb));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sh.on{transform:none}
.sh .grab{width:42px;height:5px;border-radius:5px;background:var(--line2);margin:0 auto 12px}
.sh h3{font:700 22px "Oswald";text-transform:uppercase;margin-bottom:4px}

/* editor avatar */
.ed-prev{width:150px;height:150px;margin:4px auto 6px}
.opts{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:4px 0}
.opts::-webkit-scrollbar{display:none}
.op{flex:0 0 auto;min-width:44px;height:44px;border-radius:12px;background:var(--card2);border:2px solid transparent;display:flex;align-items:center;justify-content:center;font:700 12px "Barlow Semi Condensed";padding:0 10px;text-transform:uppercase}
.op.on{border-color:var(--grn)}
.op.col{padding:0;width:44px}.op.col i{width:28px;height:28px;border-radius:50%;display:block;border:1px solid rgba(255,255,255,.2)}
.op svg{width:40px;height:40px}

/* ingresso */
.gate{flex:1;overflow-y:auto;padding:calc(var(--st) + 26px) 20px calc(30px + var(--sb))}
.gate .big{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:22px}
.gate .big svg{width:84px;height:84px;filter:drop-shadow(0 0 24px rgba(255,214,10,.35))}
.gate .big h1{font:700 38px "Oswald";line-height:.95;text-transform:uppercase;margin-top:12px}
.gate .big h1 i{font-style:normal;color:var(--yel);display:block}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px;border-radius:12px;font:800 13px "Barlow Semi Condensed";text-transform:uppercase;letter-spacing:.5px;color:var(--t2)}
.seg button.on{background:var(--yel);color:#000}
.toast{position:absolute;left:50%;top:calc(var(--st) + 14px);transform:translate(-50%,-140%);z-index:200;background:#fff;color:#000;padding:11px 16px;border-radius:14px;font:700 14px "Barlow";box-shadow:0 8px 30px rgba(0,0,0,.5);transition:transform .25s,opacity .25s,visibility .25s;max-width:90%;text-align:center;opacity:0;visibility:hidden;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1;visibility:visible}
.bigcode{font:800 38px "Barlow Semi Condensed";letter-spacing:4px;white-space:nowrap;text-align:center;color:var(--yel);margin:10px 0}
@media(max-width:360px){.ttl{font-size:26px}.nav .tb .tl{font-size:11px}.nav .tb.on{padding:14px 12px}.match{grid-template-columns:1fr auto 1fr}.mid{min-width:48px}.tm{padding:8px 7px;gap:6px}.tm .nm{font-size:13px}}
</style>
</head>
<body data-tab="home">

<script>
// ════════════════════════════════════════════════════════════
//  FOOTBALL SURVIVOR — una squadra di Serie A a giornata:
//  se vince passi, se pareggia o perde sei fuori (salvo vite).

// ════════════════════════════════════════════════════════════

// Configurazione Firebase: finché è vuota l'app gira in MODALITÀ PROVA (dati salvati solo su questo telefono)
const FB_CONFIG = {
  apiKey: 'AIzaSyD3S-Jrh_CHrcMZ4zHYe9DI1E33o8S0ENY',
  authDomain: 'football-survivor-178db.firebaseapp.com',

};
const DEMO = !FB_CONFIG || /[?&]prova\b/.test(location.search); // ?prova: modalità prova anche online
const MAX_PICKS = 20; // 20 squadre: dopo 20 giornate il gioco finisce

// ---------- utilità ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// ora vera presa dal server (non dall'orologio del telefono, che si può spostare per scegliere dopo la scadenza)
let CLOCK_OFF = 0;
const NOW = () => (window.__now ? new Date(window.__now) : new Date(Date.now() + CLOCK_OFF));
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }, del(k) { try { localStorage.removeItem(k); } catch (e) { } } };
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), 2600); }
const slug = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z]/g, '');
const cap = s => String(s || '').trim().toLowerCase().replace(/(^|[\s'-])\S/g, x => x.toUpperCase());

function mdOptions() { const o = openMd() || 1; let h = ''; for (let md = o; md <= 38 - MAX_PICKS + 1; md++) h += `<option value="${md}">${md}ª giornata · ${fmtDay(SA.mds[md][0].utc)}</option>`; return h || `<option value="${o}">${o}ª giornata</option>`; }
const val = id => ($('#' + id) || {}).value || '';
async function sendRequest() {
  const code = val('g-lc').trim().toUpperCase(), n = cap(val('g-n')), c = cap(val('g-c'));
  if (!code || !n || !c) return toast('Compila codice lega, nome e cognome');
  const lg = await Store.getLeague(code).catch(() => null); if (!lg) return toast('Nessuna lega con questo codice');
  // stesso nome di qualcuno già nella lega: diventa nome.cognome2, nome.cognome3…
  const base = uname(n, c); let u = base;
  const all = await Store.getMembers(code);
  if (all[base]) {
    let i = 2; while (all[base + i]) i++; u = base + i;
    if (!confirm(`Nella lega c'è già ${base}.\n\nSe sei tu e sei già entrato da un altro telefono, premi Annulla e usa «Ho già il codice».\n\nSe sei un'altra persona, premi OK: il tuo nome utente sarà ${u}.`)) return;
  }
  try { await Store.joinRequest(code, u, { nome: n, cognome: c, status: 'pending', created: new Date().toISOString(), lives: 0, picks: {}, avatar: avDefault(u) }); }
  catch (e) { console.error(e); return toast('Richiesta non riuscita: riprova'); }
  S.pending = { code, user: u, leagueName: lg.name }; LS.set('fs-pending', S.pending); render();
}
// entra con il codice personale: è il database stesso a controllare che sia giusto
async function enter(code, u, key) {
  try { await Store.login(code, u, key); return true; } catch (e) { console.error(e); return false; }
}
async function confirmCode() {
  const p = S.pending, key = normCode(val('g-pc')); if (key.length < 8) return toast('Scrivi il codice che ti ha mandato l\'organizzatore');
  const m = await Store.getMember(p.code, p.user);
  if (!m) { toast('La richiesta non c\'è più: rifalla'); return cancelPending(); }
  if (m.status === 'pending') return toast('L\'organizzatore non ti ha ancora dato il codice');
  if (!(await enter(p.code, p.user, key))) return toast('Codice sbagliato');
  if (m.status !== 'active') { const lg = await Store.getLeague(p.code); await Store.setMember(p.code, p.user, { status: 'active', fromMd: Math.max(lg.startMd || 1, openMd() || 1) }); }
  LS.del('fs-pending'); S.pending = null; startSession(p.code, p.user); toast('Benvenuto nella lega!');
}
async function loginCode() {
  // nome utente: va bene sia «nome.cognome» sia «Nome Cognome»
  const raw = val('g-u').trim(), parts = raw.includes('.') ? raw.split('.') : raw.split(/\s+/);
  const code = val('g-lc').trim().toUpperCase(), key = normCode(val('g-pc'));
  const u = raw.includes('.') ? raw.toLowerCase().replace(/[^a-z0-9.]/g, '') : uname(parts[0], parts.slice(1).join('')) + ((raw.match(/\d+$/) || [''])[0]);
  if (!code || !u || key.length < 8) return toast('Compila tutti i campi');
  if (!(await enter(code, u, key))) return toast('Dati non corretti');
  const m = await Store.getMember(code, u);
  if (m && m.status === 'invited') { const lg = await Store.getLeague(code); await Store.setMember(code, u, { status: 'active', fromMd: Math.max(lg.startMd || 1, openMd() || 1) }); }
  startSession(code, u);
}
function cancelPending() { const p = S.pending; if (p) Store.getMember(p.code, p.user).then(m => { if (m && m.status !== 'active') Store.delMember(p.code, p.user); }).catch(() => { }); LS.del('fs-pending'); S.pending = null; render(); }
async function createLeague() {
  const ln = val('c-ln').trim(), n = cap(val('c-n')), c = cap(val('c-c')), pc = genCode(), md = +val('c-md');
  if (!ln || !n || !c) return toast('Compila nome della lega, nome e cognome');
  let code;
  do { code = genCode().replace('-', '').slice(0, 6); } while (await Store.getLeague(code));
  const u = uname(n, c), now = new Date().toISOString();
  try {
    await Store.setLeague(code, { name: ln, startMd: md, created: now, admin: u, creatorUid: Store.uid });
    await Store.initBoard(code, u, { nome: n, cognome: c, status: 'active', admin: true, lives: 0, picks: {}, fromMd: md, avatar: avDefault(u), created: now });
    await Store.setSecret(code, u, await sha(normCode(pc) + u));
    if (!(await enter(code, u, normCode(pc)))) throw new Error('login');
  } catch (e) { console.error(e); return toast('Non sono riuscito a creare la lega: riprova'); }
  startSession(code, u); logAdd(`Ha creato la lega «${ln}»`);
  setTimeout(() => sheet(`<h3>Lega creata!</h3><p class="small muted">Manda questo codice agli amici: con questo chiedono di entrare.</p><div class="bigcode">${code}</div><div class="card small" style="border-color:var(--yel)">🔑 Il <b>tuo codice personale</b> è <b class="num" style="color:var(--yel);font-size:18px;letter-spacing:2px">${pc}</b><br><span class="muted">Salvalo (fai uno screenshot): ti serve per entrare da un altro telefono. Se lo perdi, un altro admin può dartene uno nuovo.</span></div><button class="btn mt" onclick="shareText('Entra nella mia lega di Football Survivor «${esc(ln)}»! Codice lega: ${code}\\n'+location.href.split('?')[0])">Condividi il codice</button><button class="btn g mt" onclick="closeSheet()">Fatto</button>`), 300);
}
function startSession(code, user) {
  saveLeague(code, user); S.code = code; S.user = user; S.adding = false;
  S.unsub.forEach(f => f()); S.unsub = []; Object.assign(S, { logOn: false, log: [], ready: false, league: null, members: {} });
  S.unsub.push(Store.watchLeague(code, l => { if (S.ready && !l) { logout(true, 'La lega è stata eliminata'); return; } S.league = l; if (l) saveLeague(code, user, l.name); render(); }));
  S.unsub.push(Store.watchMembers(code, m => {
    S.members = m;
    if (S.ready && !m[S.user]) { logout(true, 'Sei stato tolto dalla lega'); return; }
    S.ready = true;
    // il registro lo leggono solo gli admin
    if (isAdmin() && !S.logOn) { S.logOn = true; S.unsub.push(Store.watchLog(code, a => { S.log = a; render(); })); }
    render();
  }));
  // se un admin dà un nuovo codice, i telefoni con quello vecchio escono
  S.unsub.push(Store.watchDevice(code, d => { if (S.ready && !d) logout(true, 'Il tuo codice è cambiato: rientra con quello nuovo'); }));
}
function logout(silent, why) {
  const c = S.code;
  S.unsub.forEach(f => f()); S.unsub = []; if (c) dropLeague(c);
  if (c && !silent) Store.delDevice(c).catch(() => { });
  Object.assign(S, { code: null, user: null, league: null, members: {}, ready: false, tab: 'home', log: [], logOn: false });
  closeSheet(); if (silent) toast(why || 'Sei uscito dalla lega');
  const next = myLeagues()[0]; if (next) startSession(next.code, next.user); else render();
}
// toccando una lega si aprono le sue classifiche
function switchLeague(code) { const l = myLeagues().find(x => x.code === code); if (!l) return; S.tab = 'cla'; if (code === S.code) return render(); startSession(l.code, l.user); }

  const cnt = {}; S.L.act.forEach(([u, mm]) => { const x = S.L.st[u]; if (x.status === 'out' && x.elimMd < md) return; const p = mm.picks && mm.picks[md]; if (p) cnt[p] = (cnt[p] || 0) + 1; });

function askPick(md, tid) {

function ranking() {
  const L = S.L, rows = L.act.map(([u, m]) => ({ u, m, s: L.st[u] }));
  const key = r => [r.s.status === 'win' ? 2 : r.s.status === 'alive' ? 1 : 0, r.s.status === 'out' ? r.s.elimMd : r.s.last, r.s.left];
  rows.sort((a, b) => { const x = key(a), y = key(b); for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return y[i] - x[i]; return a.u.localeCompare(b.u); });
  let pos = 0, prev = null; rows.forEach((r, i) => { const k = key(r).join(); if (k !== prev) pos = i + 1; r.pos = pos; prev = k; });
  return rows;
}
function claHTML() {
  const rows = ranking(), om = openMd();

    ${ED_PARTS.map(([k, n, t]) => `<div class="fld" style="margin-top:8px"><span>${n}</span><div class="opts">${AV[ED_KEYS[k]].map(v => t === 'col' ? `<button class="op col ${a[k] === v ? 'on' : ''}" onclick="S.ed['${k}']='${v}';edRender()"><i style="background:${v}"></i></button>` : `<button class="op ${a[k] === v ? 'on' : ''}" onclick="S.ed['${k}']='${v}';edRender()">${v}</button>`).join('')}</div></div>`).join('')}
    <label class="fld"><span>Numero di maglia</span><input type="number" min="0" max="99" value="${a.num}" oninput="S.ed.num=Math.max(0,Math.min(99,parseInt(this.value)||0));document.querySelector('.ed-prev').innerHTML=avatarSVG(S.ed,S.user)"></label>
    <div class="row mt2"><button class="btn g" onclick="S.ed=avDefault(Math.random());edRender()">🎲 A caso</button><button class="btn" style="background:var(--grn)" onclick="saveAvatar()">Salva</button></div>`);
}
async function saveAvatar() { const a = S.ed; closeSheet(); await Store.setMember(S.code, S.user, { avatar: a }); toast('Avatar salvato'); }

// ---------- area organizzatore ----------
function adminHTML() {
  const all = Object.entries(S.members), pend = all.filter(([, m]) => m.status !== 'active'), act = all.filter(([, m]) => m.status === 'active').sort((a, b) => a[0].localeCompare(b[0]));
  return `<div class="sec" style="color:var(--yel)">Area organizzatore</div>
    <div class="card"><div class="row"><div class="grow"><div class="tiny muted">CODICE DELLA LEGA</div><div class="num" style="font-size:26px;letter-spacing:4px;color:var(--yel)">${esc(S.code)}</div></div><button class="btn sm" style="background:var(--yel)" onclick="shareText('Entra nella mia lega di Football Survivor «${esc(S.league.name)}»! Codice lega: ${esc(S.code)}\\n'+location.href.split('?')[0])">Condividi</button></div>
    <div class="row" style="align-items:flex-end"><label class="fld grow"><span>Nome della lega</span><input id="a-ln" maxlength="30" value="${esc(S.league.name)}"></label><button class="btn sm" style="background:var(--yel);margin-bottom:4px" onclick="renameLeague()">Salva</button></div>
    <label class="fld"><span>Si parte dalla giornata</span><select onchange="setStart(+this.value)">${Array.from({ length: 38 - MAX_PICKS + 1 }, (_, i) => i + 1).map(md => `<option value="${md}" ${md === startMd() ? 'selected' : ''}>${md}ª giornata${SA.mds[md] ? ' · ' + fmtDay(SA.mds[md][0].utc) : ''}</option>`).join('')}</select></label></div>
    <div class="sec">Richieste per entrare · ${pend.length}</div>
    ${pend.length ? `<div class="rk adm">${pend.map(([u, m]) => `<div class="rr"><div class="av">${avOf(u)}</div><div class="grow"><div class="un">${esc(u)}</div><div class="sub">${esc(m.nome)} ${esc(m.cognome)} · ${m.status === 'invited' ? '<b style="color:var(--yel)">codice dato, aspetta che lo inserisca</b>' : 'in attesa del codice'}</div></div><button class="btn sm" style="background:var(--yel)" onclick="giveCode('${u}')">${m.status === 'invited' ? 'Nuovo codice' : 'Dai codice'}</button><button class="btn sm g" onclick="rejectUser('${u}')">✕</button></div>`).join('')}</div>` : '<div class="card small muted c">Nessuna richiesta in attesa.</div>'}
    <div class="sec">Partecipanti e vite · ${act.length}</div>
    <div class="rk adm">${act.map(([u, m]) => `<div class="rr"><div class="av" onclick="adminUser('${u}')">${avOf(u)}</div><div class="grow" onclick="adminUser('${u}')"><div class="un">${esc(u)}${m.admin ? ' <span class="tag y" style="padding:2px 6px;font-size:9.5px">admin</span>' : ''}</div><div class="sub"><span class="hearts">❤</span> ${m.lives || 0} ${m.lives === 1 ? 'vita comprata' : 'vite comprate'} · altro ›</div></div><button class="btn sm g" onclick="addLife('${u}',-1)" ${m.lives ? '' : 'disabled'}>−</button><button class="btn sm" style="background:var(--pnk)" onclick="addLife('${u}',1)">+❤</button></div>`).join('')}</div>
    <div class="sec">Registro attività admin</div>${logHTML(30)}<div class="tiny muted c mt">Il registro completo è anche in Home.</div>
    <button class="btn g mt2" style="color:var(--red);border-color:color-mix(in srgb,var(--red) 50%,transparent)" onclick="askDeleteLeague()">Elimina la lega</button>`;
}
// ---------- registro attività: ogni modifica degli admin resta scritta, visibile a tutti gli admin ----------
function openLog() { sheet(`<h3>Registro attività</h3><p class="small muted" style="margin-bottom:12px">Tutte le modifiche fatte dagli admin.</p>${logHTML(200)}<button class="btn g mt2" onclick="closeSheet()">Chiudi</button>`); }
function logAdd(t) { return Store.addLog(S.code, { at: new Date().toISOString(), by: S.user, t }).catch(e => console.error(e)); }
function logHTML(n) {
  const L = (S.log || []).slice(0, n);
  if (!L.length) return '<div class="card small muted c">Ancora nessuna modifica.</div>';
  return `<div class="hist">${L.map(x => `<div class="hi" style="align-items:flex-start"><div class="av" style="width:30px;height:30px;flex:0 0 auto">${avOf(x.by)}</div><div class="grow"><div class="small" style="line-height:1.3">${esc(x.t)}</div><div class="tiny muted">${esc(x.by)} · ${fmtShort(x.at)}</div></div></div>`).join('')}</div>`;
}
function adminUser(u) {
  const m = S.members[u], admins = Object.values(S.members).filter(x => x.admin).length;
  sheet(`<div class="pf"><div class="av" style="width:84px;height:84px">${avOf(u)}</div><h2>${esc(m.nome)} ${esc(m.cognome)}</h2><div class="tiny muted">${esc(u)}${m.admin ? ' · admin' : ''}</div></div>
    ${m.admin ? (u !== S.user && admins > 1 ? `<button class="btn g mt2" onclick="setAdmin('${u}',false)">Togli i permessi di admin</button>` : '') : `<button class="btn mt2" style="background:var(--yel)" onclick="setAdmin('${u}',true)">Rendi admin</button><p class="tiny muted c mt">Un admin approva gli ingressi, gestisce le vite e corregge i risultati. Ogni modifica finisce nel registro.</p>`}
    <button class="btn g mt" onclick="giveCode('${u}',true)">Nuovo codice personale</button>
    ${u === S.user ? '' : `<button class="btn r mt" onclick="rejectUser('${u}',true)">Togli dalla lega</button>`}
    <button class="btn g mt" onclick="closeSheet()">Chiudi</button>`);
}
async function setAdmin(u, on) { closeSheet(); await Store.setMember(S.code, u, { admin: on }); logAdd(on ? `Ha reso admin ${u}` : `Ha tolto i permessi di admin a ${u}`); toast(on ? `${u} ora è admin` : `${u} non è più admin`); }
async function giveCode(u, active) {
  if (active && !confirm(`Dare a ${u} un nuovo codice personale? Quello vecchio smette di funzionare e dovrà rientrare con il nuovo.`)) return;
  const code = genCode();
  try {
    await Store.setSecret(S.code, u, await sha(normCode(code) + u));
    if (active) await Store.delDevicesOf(S.code, u); // i telefoni con il codice vecchio escono
    else await Store.setMember(S.code, u, { status: 'invited' });
  } catch (e) { console.error(e); return toast('Operazione non riuscita'); }
  logAdd(active ? `Nuovo codice personale per ${u}` : `Ha dato il codice di ingresso a ${u}`);
  const txt = `Ciao! Ecco il tuo codice personale per Football Survivor (lega «${S.league.name}»): ${code}\nNome utente: ${u}`;
  sheet(`<h3>Codice per ${esc(u)}</h3><p class="small muted">Mandaglielo: lo scrive nell'app per entrare. Lo vedi solo adesso: se lo perdi, generane uno nuovo.</p><div class="bigcode">${code}</div>
    <button class="btn" style="background:var(--grn)" onclick='shareText(${JSON.stringify(txt)})'>Invia su WhatsApp / altro</button><button class="btn g mt" onclick="closeSheet()">Fatto</button>`);
}
async function rejectUser(u, active) { if (!confirm(active ? `Togliere ${u} dalla lega? Perde scelte e vite.` : `Rifiutare la richiesta di ${u}?`)) return; closeSheet(); await Store.delDevicesOf(S.code, u).catch(() => { }); await Store.delSecret(S.code, u).catch(() => { }); await Store.delMember(S.code, u); logAdd(active ? `Ha tolto ${u} dalla lega` : `Ha rifiutato la richiesta di ${u}`); toast(active ? 'Partecipante tolto' : 'Richiesta rifiutata'); }
async function addLife(u, d) {
  const m = S.members[u], n = Math.max(0, (m.lives || 0) + d), s = S.L.st[u], upd = { lives: n };
  // ripescaggio: se era eliminato rientra e le giornate perse mentre era fuori non contano
  const rev = d > 0 && s && s.status === 'out';
  if (rev) upd.skips = { [s.elimMd]: Math.max(s.elimMd + 1, openMd() || s.elimMd + 1) };
  await Store.setMember(S.code, u, upd);
  logAdd(`${d > 0 ? '+1 vita' : '−1 vita'} a ${u} (ora ${n})${rev ? ' · ripescato in gioco' : ''}`);
  toast(rev ? `${u} ripescato in gioco!` : d > 0 ? `+1 vita a ${u}` : `Tolta una vita a ${u}`);
}
async function setPlays(on) { await Store.setMember(S.code, S.user, { plays: on }); logAdd(on ? 'Partecipa al gioco' : 'Non partecipa al gioco (solo admin)'); toast(on ? 'Ora giochi anche tu' : 'Ora sei solo admin: non compari in classifica'); }
async function renameLeague() {
  const n = val('a-ln').trim(); if (!n) return toast('Scrivi un nome');
  if (n === S.league.name) return;
  const old = S.league.name; await Store.setLeague(S.code, { name: n }); logAdd(`Ha rinominato la lega: «${old}» → «${n}»`); toast('Nome della lega cambiato');
}
function askDeleteLeague() {
  sheet(`<h3 style="color:var(--red)">Elimina la lega</h3><p class="small muted">Spariscono per sempre partecipanti, scelte, vite e registro. Tutti escono dall'app. Non si può annullare.</p>
    <label class="fld"><span>Per confermare scrivi il nome della lega: ${esc(S.league.name)}</span><input id="a-del" autocomplete="off"></label>
    <button class="btn r mt2" onclick="deleteLeague()">Elimina per sempre</button><button class="btn g mt" onclick="closeSheet()">Annulla</button>`);
}
async function deleteLeague() {
  if (val('a-del').trim().toLowerCase() !== S.league.name.trim().toLowerCase()) return toast('Il nome non corrisponde');
  const c = S.code; closeSheet(); toast('Elimino la lega…');
  try { await logAdd(`Ha eliminato la lega «${S.league.name}»`); await Store.deleteLeague(c, S.user); } catch (e) { console.error(e); return toast('Eliminazione non riuscita'); }
  logout(true, 'Lega eliminata');
}
async function setStart(md) { await Store.setLeague(S.code, { startMd: md }); logAdd(`Giornata di partenza: ${md}ª`); toast(`Si parte dalla ${md}ª giornata`); }
function adminResult(id) {
  const m0 = SA.matches.find(x => x.id === id), m = eff(m0), ov = S.league.overrides && S.league.overrides[id];
  sheet(`<h3>Correggi risultato</h3><p class="small muted">${esc(team(m.home).name)} – ${esc(team(m.away).name)} · ${m.md}ª giornata</p>
    <div class="row mt"><label class="fld grow"><span>${esc(team(m.home).short || team(m.home).name)}</span><input id="r-h" type="number" min="0" inputmode="numeric" value="${m.hg ?? ''}"></label><label class="fld grow"><span>${esc(team(m.away).short || team(m.away).name)}</span><input id="r-a" type="number" min="0" inputmode="numeric" value="${m.ag ?? ''}"></label></div>
    <button class="btn mt2" onclick="saveResult('${id}','FINISHED')">Salva come finita</button>
    <button class="btn g mt" onclick="saveResult('${id}','POSTPONED')">Segna come rinviata</button>
    ${ov ? `<button class="btn g mt" onclick="saveResult('${id}',null)">Torna al risultato automatico</button>` : ''}`);
}
async function saveResult(id, st) {
  const o = st ? { status: st, hg: st === 'FINISHED' ? +val('r-h') : null, ag: st === 'FINISHED' ? +val('r-a') : null } : Store.field.del();
  const m = SA.matches.find(x => x.id === id), nm = `${team(m.home).short || team(m.home).name}-${team(m.away).short || team(m.away).name}`;
  closeSheet(); await Store.setLeague(S.code, { overrides: { [id]: o } });
  logAdd(st === 'FINISHED' ? `Risultato corretto: ${nm} ${o.hg}-${o.ag}` : st ? `Partita segnata come rinviata: ${nm}` : `Risultato automatico ripristinato: ${nm}`);
  toast('Risultato aggiornato');
}

// ════════════ AVVIO ════════════
(async function boot() {
  $('#app').innerHTML = `<div class="gate"><div class="big" style="margin-top:30vh">${BALL}</div></div>`;
  await Promise.all([loadSerieA(), Store.ready.catch(() => { })]);
  S.pending = LS.get('fs-pending', null);
  // vecchio formato (una sola lega) → elenco leghe
  const old = LS.get('fs-session', null); if (old) { saveLeague(old.code, old.user); LS.del('fs-session'); }
  // il telefono resta dentro finché esiste il suo accesso nel database
  // tiene solo le leghe in cui il telefono è ancora dentro, e riapre l'ultima usata
  const ok = [];
  for (const x of myLeagues()) { try { const d = await Store.getDevice(x.code); if (d) ok.push(Object.assign(x, { user: d.user })); } catch (e) { console.error(e); } }
  LS.set('fs-leagues', ok);
  const act = ok.find(x => x.code === LS.get('fs-active', null)) || ok[0];
  if (act) startSession(act.code, act.user); else render();
  setInterval(async () => { await loadSerieA(); render(); }, 10 * 60000);
  setInterval(() => { if (!S.sheetHTML && S.user) render(); }, 60000); // conto alla rovescia
})();
</script>
</body>
</html>
